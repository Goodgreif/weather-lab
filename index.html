m:translateX(7px)}75%{transform:translateX(-4px)}}.feedback{text-align:center;min-height:40px;font-weight:900;font-size:23px;margin-top:10px}.controls{text-align:center}.controls button,.finish button{border:0;border-radius:999px;padding:13px 22px;margin:5px;font-size:17px;font-weight:900;background:#17324d;color:white}.secondary{background:white!important;color:#17324d!important;border:3px solid #17324d!important}.forecast{background:#f4fbff;border:3px solid #b7e4fb;padding:14px;border-radius:18px;text-align:center;font-size:20px;margin-bottom:14px}.finish{text-align:center}.hero{font-size:85px}.cert{max-width:620px;margin:14px auto;padding:16px;border:4px dashed #e7bc43;border-radius:18px;background:#fff8d9}

<div class="card"><header>
<div><span id="levelBadge" class="badge">Level 1 of 8</span><h1>🌦️ Little Builders – Weather Lab</h1><div class="sub">Grow from Weather Explorer to Junior Meteorologist!</div></div>
<div class="headerActions">
  <button id="chooseLevelBtnTop" class="bigLevelButton">🗺️ CHOOSE LEVEL</button>

  </div>

<script>
(()=>{const $=id=>document.getElementById(id),game=$('game'),prompt=$('prompt'),lessonTitle=$('lessonTitle'),feedback=$('feedback'),fact=$('fact');const SAVE_KEY='littleBuildersWeatherLabProgressV1';
let level=0,round=0,stars=0,badges=0,locked=false,soundOn=true;
let speechOn=true;
let currentChoiceNames=[];
let currentForecastNarration='';
let preferredVoice=null;

function chooseFriendlyVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices=window.speechSynthesis.getVoices();
  if(!voices.length) return;

  const english=voices.filter(v=>/^en(-|_)/i.test(v.lang));
  const preferredNames=[
    'Samantha','Ava','Allison','Susan','Zira','Jenny','Aria',
    'Google US English','Google UK English Female','Karen','Moira'
  ];

  preferredVoice=
    preferredNames.map(name=>english.find(v=>v.name.toLowerCase().includes(name.toLowerCase()))).find(Boolean)
    || english.find(v=>/female|natural|enhanced|premium/i.test(v.name))
    || english[0]
    || voices[0];
}

if('speechSynthesis' in window){
  chooseFriendlyVoice();
  window.speechSynthesis.onvoiceschanged=chooseFriendlyVoice;
}

function speak(text){
  if(!speechOn || !text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  chooseFriendlyVoice();

  const u=new SpeechSynthesisUtterance(text);
  if(preferredVoice){
    u.voice=preferredVoice;
    u.lang=preferredVoice.lang || 'en-US';
  }else{
    u.lang='en-US';
  }

  // Slower, warmer delivery for young children.
  u.rate=0.84;
  u.pitch=1.08;
  u.volume=1;
  window.speechSynthesis.speak(u);
}

function speakQuestion(){
  const questionText=prompt.textContent.trim();
  const intro=currentForecastNarration ? [currentForecastNarration,questionText] : [questionText];
  if(currentChoiceNames.length){
    speakSequence(intro.concat(['Your choices are.']).concat(currentChoiceNames),700);
  }else{
    speakSequence(intro,700);
  }
}

function speakSequence(items, pauseMs=650){
  if(!speechOn || !('speechSynthesis' in window) || !items.length) return;
  window.speechSynthesis.cancel();
  chooseFriendlyVoice();

  let index=0;
  function next(){
    if(index>=items.length) return;
    const u=new SpeechSynthesisUtterance(items[index]);
    if(preferredVoice){
      u.voice=preferredVoice;
      u.lang=preferredVoice.lang || 'en-US';
    }else{
      u.lang='en-US';
    }
    u.rate=0.82;
    u.pitch=1.08;
    u.volume=1;
    u.onend=()=>{
      index++;
      if(index<items.length) setTimeout(next,pauseMs);
    };
    window.speechSynthesis.speak(u);
  }
  next();
}

let completedLevels=[];

function loadProgress(){
  try{
    const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(!saved)return;
    level=Number.isInteger(saved.level)?Math.max(0,Math.min(7,saved.level)):0;
    round=Number.isInteger(saved.round)?Math.max(0,Math.min(2,saved.round)):0;
    stars=Number.isFinite(saved.stars)?Math.max(0,saved.stars):0;
    badges=Number.isFinite(saved.badges)?Math.max(0,saved.badges):0;
    completedLevels=Array.isArray(saved.completedLevels)
      ? saved.completedLevels.filter(n=>Number.isInteger(n)&&n>=0&&n<8)
      : [];
  }catch(e){}
}
function saveProgress(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      level,round,stars,badges,completedLevels
    }));
    const s=document.getElementById('saveStatus');
    if(s)s.textContent='💾 Progress saved on this device';
  }catch(e){
    const s=document.getElementById('saveStatus');
    if(s)s.textContent='⚠️ Progress saving is unavailable in this browser mode';
  }
}

const pickerOverlay=document.getElementById('levelPickerOverlay');
const levelGrid=document.getElementById('levelGrid');
const chooseLevelBtn=document.getElementById('chooseLevelBtn');
const readQuestionBtn=document.getElementById('readQuestionBtn');
const chooseLevelBtnTop=document.getElementById('chooseLevelBtnTop');
const closePickerBtn=document.getElementById('closePickerBtn');
const clearProgressBtn=document.getElementById('clearProgressBtn');
const levelIcons=['☀️','🧥','🌡️','🌧️','🧭','💧','📅','⛈️'];
const levelDescriptions=[
 'Recognize common weather',
 'Choose clothes and gear',
 'Hot, cold, and thermometers',
 'Rain, snow, and hail',
 'Meteorologist instruments',
 'Evaporation to precipitation',
 'Read a simple forecast',
 'Make safe weather choices'
];

function buildLevelPicker(){
  levelGrid.innerHTML=names.map((name,i)=>`
    <button class="levelJump ${completedLevels.includes(i)?'completed':''}" data-level="${i}">
      <span>${completedLevels.includes(i)?'✅':levelIcons[i]}</span>
      <b>Level ${i+1}: ${name}</b>
      <small>${levelDescriptions[i]}</small>
    </button>`).join('');
  levelGrid.querySelectorAll('.levelJump').forEach(btn=>{
    btn.onclick=()=>{
      level=Number(btn.dataset.level);
      round=0;
      locked=false;
      saveProgress();
      closeLevelPicker();
      render();
    };
  });
}
function openLevelPicker(){buildLevelPicker();pickerOverlay.classList.add('show');pickerOverlay.setAttribute('aria-hidden','false')}
function closeLevelPicker(){pickerOverlay.classList.remove('show');pickerOverlay.setAttribute('aria-hidden','true')}
const names=['Weather','Dress','Temperature','Precipitation','Tools','Water Cycle','Forecast','Safety'];
function sh(a){return [...a].sort(()=>Math.random()-.5)}function tone(f=700,d=.12){if(!soundOn)return;let C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.1;o.connect(g).connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}function top(){
  badges=completedLevels.length;
  $('stars').textContent=stars;
  $('badges').textContent=badges;
  $('fill').style.width=Math.min(100,completedLevels.length/8*100)+'%';
  $('levelBadge').textContent=level<8?`Level ${level+1} of 8`:'Adventure Complete';
  $('map').innerHTML=names.map((n,i)=>`<div class="${completedLevels.includes(i)?'done':i===level?'current':''}">${completedLevels.includes(i)?'✓ ':''}${i+1}. ${n}</div>`).join('')
}
function lesson(t){game.innerHTML=`<div class="lesson">${t}</div>`}function grid(opts,ans,f){
 let g=document.createElement('div');g.className='grid';
 const shown=sh(opts);
 currentChoiceNames=shown.map(o=>o.l);
 shown.forEach(o=>{
   let b=document.createElement('div');b.className='choice';
   b.innerHTML=`<div class="emoji">${o.e}</div><div>${o.l}</div>`;
   b.onclick=()=>pick(b,o.v===ans,f);
   g.appendChild(b)
 });
 game.appendChild(g);

 // Read the FULL question first. Only after it finishes do we read the choices.
 // This prevents the answer narration from cancelling the last words of the question.
 setTimeout(()=>{
   const questionText=prompt.textContent.trim();
   const intro=currentForecastNarration ? [currentForecastNarration,questionText] : [questionText];
   const narration=intro.concat(['Your choices are.']).concat(currentChoiceNames);
   speakSequence(narration,700);
 },350);
}function pick(el,ok,f){if(locked)return;if(ok){locked=true;el.classList.add('correct');stars++;feedback.textContent='Correct! ⭐';speak('That is correct. Great job!');fact.textContent=f;fact.style.display='block';tone(760);setTimeout(()=>{
  round++;
  if(round===3){
    if(!completedLevels.includes(level))completedLevels.push(level);
    level++;
    round=0;
    badges=completedLevels.length;
  }
  saveProgress();
  render()
},1050)}else{el.classList.add('wrong');feedback.textContent='Good try — look again.';speak('Good try. Let’s look again.');tone(220);setTimeout(()=>el.classList.remove('wrong'),320)}}
const Q=[
()=>{lessonTitle.textContent='Weather Explorer';lesson('Weather describes what the <b>air and sky</b> are doing right now.');let q=[['Find rainy weather','rain','Rain is liquid water falling from clouds.'],['Find windy weather','wind','Wind is moving air.'],['Find snowy weather','snow','Snow is made of ice crystals.']][round];prompt.textContent=q[0];grid([{v:'sun',l:'Sunny',e:'☀️'},{v:'rain',l:'Rainy',e:'🌧️'},{v:'wind',l:'Windy',e:'💨'},{v:'snow',l:'Snowy',e:'🌨️'}],q[1],q[2])},
()=>{lessonTitle.textContent='Weather Ready';lesson('Weather helps us choose what to <b>wear or carry</b>.');let s=[['It is raining. What should you take?','umbrella','An umbrella helps keep rain off you.',[{v:'umbrella',l:'Umbrella',e:'☂️'},{v:'sled',l:'Sled',e:'🛷'},{v:'fan',l:'Fan',e:'🪭'},{v:'sandals',l:'Sandals',e:'🩴'}]],['It is snowy and cold. What should you wear?','coat','A warm coat helps your body keep heat.',[{v:'coat',l:'Warm coat',e:'🧥'},{v:'shorts',l:'Shorts',e:'🩳'},{v:'swim',l:'Swimsuit',e:'🩱'},{v:'shade',l:'Sunglasses',e:'🕶️'}]],['It is sunny and hot. What helps protect you?','hat','A sun hat gives shade from strong sunlight.',[{v:'hat',l:'Sun hat',e:'👒'},{v:'scarf',l:'Scarf',e:'🧣'},{v:'sled',l:'Sled',e:'🛷'},{v:'coat',l:'Heavy coat',e:'🧥'}]]][round];prompt.textContent=s[0];grid(s[3],s[1],s[2])},
()=>{lessonTitle.textContent='Temperature Scientist';lesson('Temperature tells how <b>hot or cold</b> the air is.');let s=[['Which temperature is colder?','a','32°F is colder than 75°F.',[{v:'a',l:'32°F',e:'❄️'},{v:'b',l:'75°F',e:'🌤️'},{v:'c',l:'90°F',e:'☀️'},{v:'d',l:'100°F',e:'🔥'}]],['Water can freeze near which temperature?','a','Fresh water freezes near 32°F (0°C).',[{v:'a',l:'32°F',e:'🧊'},{v:'b',l:'70°F',e:'🙂'},{v:'c',l:'90°F',e:'☀️'},{v:'d',l:'120°F',e:'🔥'}]],['Which tool measures air temperature?','therm','A thermometer measures temperature.',[{v:'therm',l:'Thermometer',e:'🌡️'},{v:'rain',l:'Rain gauge',e:'🪣'},{v:'wind',l:'Wind vane',e:'🧭'},{v:'clock',l:'Clock',e:'🕒'}]]][round];prompt.textContent=s[0];grid(s[3],s[1],s[2])},
()=>{lessonTitle.textContent='Precipitation Detective';lesson('<b>Precipitation</b> is water that falls from clouds.');let s=[['Which is liquid precipitation?','rain','Rain is liquid water.',[{v:'rain',l:'Rain',e:'🌧️'},{v:'snow',l:'Snow',e:'❄️'},{v:'hail',l:'Hail',e:'🧊'},{v:'fog',l:'Fog',e:'🌫️'}]],['Which is made of ice crystals?','snow','Snowflakes are ice crystals.',[{v:'snow',l:'Snow',e:'🌨️'},{v:'rain',l:'Rain',e:'🌧️'},{v:'fog',l:'Fog',e:'🌫️'},{v:'dew',l:'Dew',e:'💧'}]],['Which can fall as lumps of ice?','hail','Hail grows inside strong thunderstorm clouds.',[{v:'hail',l:'Hail',e:'🧊'},{v:'rain',l:'Rain',e:'🌧️'},{v:'fog',l:'Fog',e:'🌫️'},{v:'sun',l:'Sunshine',e:'☀️'}]]][round];prompt.textContent=s[0];grid(s[3],s[1],s[2])},
()=>{lessonTitle.textContent='Meteorologist Tools';lesson('Meteorologists use instruments to <b>measure the atmosphere</b>.');let s=[['Which tool measures rainfall?','g','A rain gauge collects and measures rain.',[{v:'g',l:'Rain gauge',e:'🪣'},{v:'t',l:'Thermometer',e:'🌡️'},{v:'v',l:'Wind vane',e:'🧭'},{v:'r',l:'Ruler',e:'📏'}]],['Which tool shows wind direction?','v','A wind vane shows wind direction.',[{v:'v',l:'Wind vane',e:'🧭'},{v:'g',l:'Rain gauge',e:'🪣'},{v:'t',l:'Thermometer',e:'🌡️'},{v:'c',l:'Clock',e:'🕒'}]],['Which tool measures wind speed?','a','An anemometer measures wind speed.',[{v:'a',l:'Anemometer',e:'🎡'},{v:'t',l:'Thermometer',e:'🌡️'},{v:'g',l:'Rain gauge',e:'🪣'},{v:'r',l:'Ruler',e:'📏'}]]][round];prompt.textContent=s[0];grid(s[3],s[1],s[2])},
()=>{lessonTitle.textContent='Water Cycle Lab';lesson('Water moves through <b>evaporation → condensation → precipitation → collection</b>.');let s=[['The Sun warms a puddle. What happens next?','e','Evaporation changes liquid water into water vapor.',[{v:'e',l:'Evaporation',e:'💧⬆️'},{v:'f',l:'Freezing',e:'🧊'},{v:'s',l:'Snowfall',e:'🌨️'},{v:'w',l:'Wind',e:'💨'}]],['Water vapor cools and forms clouds. What is this?','c','Condensation forms tiny liquid droplets.',[{v:'c',l:'Condensation',e:'☁️'},{v:'e',l:'Evaporation',e:'💧⬆️'},{v:'m',l:'Melting',e:'🧊➡️💧'},{v:'h',l:'Heating',e:'🔥'}]],['Cloud droplets grow heavy and fall. What is this?','p','Precipitation is water falling from clouds.',[{v:'p',l:'Precipitation',e:'🌧️'},{v:'c',l:'Collection',e:'🏞️'},{v:'e',l:'Evaporation',e:'☀️💧'},{v:'w',l:'Wind',e:'💨'}]]][round];prompt.textContent=s[0];grid(s[3],s[1],s[2])},
()=>{lessonTitle.textContent='Forecast Reader';
lesson('A <b>forecast</b> uses weather observations and computer models to predict what may happen next.');
const sets=[
 {forecast:'Tomorrow. Temperature 62 degrees Fahrenheit. Chance of rain 80 percent.',
  card:'<div class="big">🌧️</div><b>Tomorrow:</b> 62°F &nbsp; • &nbsp; Rain chance: 80%',

  fact:'An 80 percent rain chance means rain is much more likely than a dry day.',
  opts:[{v:'rain',l:'Rain',e:'🌧️'},{v:'snow',l:'Snow',e:'🌨️'},{v:'sun',l:'Sunny',e:'☀️'},{v:'hot',l:'Very hot',e:'🔥'}]},
 {forecast:'This afternoon. Temperature 91 degrees Fahrenheit. Chance of rain 5 percent.',
  card:'<div class="big">☀️</div><b>Afternoon:</b> 91°F &nbsp; • &nbsp; Rain chance: 5%',
  ask:'Which description fits best?',ans:'hotdry',
  fact:'91 degrees is hot, and a 5 percent rain chance means rain is unlikely.',
  opts:[{v:'hotdry',l:'Hot and mostly dry',e:'☀️'},{v:'snow',l:'Cold and snowy',e:'❄️'},{v:'storm',l:'Stormy',e:'⛈️'},{v:'freeze',l:'Freezing',e:'🧊'}]},
 {forecast:'This morning. Temperature 55 degrees Fahrenheit. Wind speed 25 miles per hour.',
  card:'<div class="big">💨</div><b>Morning:</b> 55°F &nbsp; • &nbsp; Wind: 25 mph',
  ask:'What should you notice most?',ans:'windy',
  fact:'25 mile per hour wind is noticeably windy, even when the temperature is mild.',
  opts:[{v:'windy',l:'It will be windy',e:'💨'},{v:'snow',l:'Heavy snow',e:'🌨️'},{v:'heat',l:'Extreme heat',e:'🔥'},{v:'calm',l:'No wind',e:'🍃'}]}
];
const s=sets[round];
card(s.card);
prompt.textContent=s.ask;
currentForecastNarration=s.forecast;
